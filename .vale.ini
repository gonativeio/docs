# Vale configuration for the Median docs (docs.median.co)
# Mintlify's Vale CI check reads this file automatically.
# Run locally with: vale docs/

StylesPath = styles
# CI shows warnings and errors; run `vale --minAlertLevel=suggestion docs/` locally for the rest
MinAlertLevel = warning
Vocab = Median

[*.mdx]
BasedOnStyles = Vale, Median

# Generated daily by the release-notes sync: edit the sheet, not these files.
[docs/changelog*.mdx]
BasedOnStyles =

# The localization page lists button labels in many languages
[docs/localization.mdx]
Vale.Spelling = NO
