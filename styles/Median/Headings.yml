extends: capitalization
message: "'%s' should use sentence case."
link: https://github.com/gonativeio/docs/blob/main/AGENTS.md#style
level: warning
scope: heading
match: $sentence
# Allow a capital letter after a colon, as in "Step 1: Create an instance"
indicators:
  - ':'
# Proper nouns that keep their capitalization in headings.
# Add a product or brand here when it's flagged by mistake.
